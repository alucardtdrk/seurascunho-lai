:root {
  --ink: #322c2f;
  --ink-soft: #766c71;
  --ink-faint: #8a7d83;
  --paper: #fbf7f8;
  --paper-deep: #f3e8ec;
  --white: #fffefe;
  --citrus: #d79aaa;
  --coral: #9b4d68;
  --sky: #bfe4f4;
  --lavender: #dccff8;
  --line: rgba(23, 32, 51, 0.1);
  --line-strong: rgba(23, 32, 51, 0.17);
  --shadow: 0 18px 45px rgba(40, 39, 33, 0.08);
  --radius: 18px;
  --font-sans: "DM Sans", ui-sans-serif, system-ui, sans-serif;
  --font-display: "Fraunces", Georgia, serif;
}



* {
  box-sizing: border-box;
}
html {
  min-width: 320px;
  background: var(--paper);
}
body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--font-sans);
  font-size: 14px;
  -webkit-font-smoothing: antialiased;
}
button,
input,
textarea {
  font: inherit;
}
button {
  border: 0;
}
button:not(:disabled),
a {
  cursor: pointer;
}
button:focus-visible,
input:focus-visible,
textarea:focus-visible {
  outline: 3px solid rgba(215, 154, 170, 0.7);
  outline-offset: 3px;
}

.app-shell {
  display: flex;
  min-height: 100vh;
  background: var(--paper);
}
.sidebar {
  width: 252px;
  flex: 0 0 252px;
  border-right: 1px solid var(--line);
  display: flex;
  flex-direction: column;
  min-height: 100vh;
  padding: 21px 14px 16px;
  
  background: rgba(251, 247, 248, 0.78);
}
.sidebar.is-collapsed {
  width: 76px;
  flex-basis: 76px;
  padding-left: 12px;
  padding-right: 12px;
}
.sidebar-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 31px;
  min-height: 34px;
}
.brand-button {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  padding: 0 7px;
  color: var(--ink);
  background: transparent;
}
.brand-name {
  font-family: var(--font-display);
  font-size: 20px;
  letter-spacing: -0.03em;
  font-weight: 600;
}
.brand-mark {
  width: 47px;
  height: 47px;
  border-radius: 15px 15px 15px 6px;
  background: var(--citrus);
  display: inline-grid;
  place-items: center;
  transform: rotate(-3deg);
  position: relative;
  flex: 0 0 auto;
  box-shadow: 3px 3px 0 rgba(23, 32, 51, 0.08);
}
.brand-mark-small {
  width: 31px;
  height: 31px;
  border-radius: 10px 10px 10px 4px;
}
.brand-mark-sheet {
  width: 24px;
  height: 29px;
  position: relative;
  background: var(--ink);
  border-radius: 3px 3px 2px 2px;
  display: block;
}
.brand-mark-small .brand-mark-sheet {
  width: 16px;
  height: 19px;
}
.brand-mark-fold {
  position: absolute;
  right: 0;
  top: 0;
  width: 9px;
  height: 9px;
  background: var(--citrus);
  clip-path: polygon(0 0, 100% 100%, 0 100%);
}
.brand-mark-small .brand-mark-fold {
  width: 6px;
  height: 6px;
}
.brand-mark-line {
  position: absolute;
  left: 6px;
  height: 2px;
  background: var(--citrus);
  border-radius: 4px;
}
.brand-mark-line-one {
  width: 10px;
  bottom: 9px;
}
.brand-mark-line-two {
  width: 7px;
  bottom: 4px;
}
.brand-mark-small .brand-mark-line {

.hero-mark-lockup {

}

}

  width: 22px;

.swatch-ink {

}
.swatch-paper {

}
.swatch-citrus {
  background: var(--citrus);
}
.swatch-coral {

}
.swatch-sky {

}
.swatch-lavender {

.swatch-row div {

.swatch-row small {

.type-panel {

.type-display {

.demo-input {

.identity-footer {

/* Tailwind compatibility tokens used by the starter surface. */
@layer base {

/* Pink accents retain the draft's paper layout and typography. */
body {min-height:100dvh;} h1,h2,h3 {text-wrap:balance;} p {text-wrap:pretty;}
.new-note-button,.primary-button {background:var(--citrus);color:var(--ink);}
.new-note-button .shortcut {color:var(--ink);border-color:#9b4d6866;}
.toolbar-row {flex-wrap:wrap;}.toolbar-tools {flex:1;min-width:250px;justify-content:flex-end;}.search-box {width:auto;max-width:320px;flex:1;}
.nav-item.selected,.view-tabs button.active {background:#f2dce4;color:#794052;}
.notes-grid,.pinned-grid {grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));}
.note-card {width:100%;min-width:0;aspect-ratio:1.15;min-height:260px;max-height:360px;padding:22px 20px 18px;border-radius:3px 3px 22px 3px;border-color:#ead1da;box-shadow:1px 5px 9px #793f5210;background:#fcedf2;} .note-card h3 {overflow-wrap:anywhere;}
.note-card::before {height:32px;background:#eec9d661;border-bottom:1px solid #d79aaa22;pointer-events:none;}
.note-card::after {content:"";position:absolute;right:0;bottom:0;width:19px;height:19px;background:#e6b5c5;clip-path:polygon(100% 0,100% 100%,0 100%);pointer-events:none;}
.note-card:hover {box-shadow:1px 7px 12px #793f5218;}
.note-card-top,.note-card-bottom {position:relative;}.note-card-top {z-index:1;top:-19px;}
.note-card-actions {display:flex;gap:5px;flex-shrink:0;}.copy-note-button {color:#9b6679;}.copy-note-button.is-copied {color:#794052;background:#eec9d6;}
.note-copy-status {display:block;min-height:14px;margin-top:6px;font-size:10px;line-height:1.4;color:#794052;}
.note-title-button {font:inherit;color:inherit;background:transparent;text-align:left;padding:0;}
.note-card p {white-space:pre-wrap;overflow-wrap:anywhere;}

.flows-heading {display:flex;align-items:center;justify-content:space-between;gap:4px;}

.flow-add-button:hover {background:#f2dce4;}
dialog.modal-backdrop.new-flow-dialog {width:min(440px,calc(100% - 32px));}
.new-flow-form {padding:26px;}.new-flow-heading {display:flex;align-items:center;justify-content:space-between;gap:12px;}.new-flow-heading h2 {font-family:var(--font-display);font-size:25px;margin:0;}
.new-flow-form>p {font-size:12px;line-height:1.6;color:var(--ink-soft);margin:12px 0 22px;}
.new-flow-form>label {display:block;font-size:12px;font-weight:600;margin-bottom:8px;}
.new-flow-form>input {box-sizing:border-box;width:100%;border:1px solid var(--line-strong);border-radius:8px;background:var(--paper);color:var(--ink);padding:12px;font:inherit;}
.new-flow-form .editor-actions {margin-top:24px;justify-content:flex-end;gap:10px;}
.new-flow-form>.flow-name-error {color:#8a2948;margin:10px 0 0;}
.app-error {color:#8a2948;background:#ffe9ef;border:1px solid #e4afbe;padding:12px 18px;margin:15px 22px;font-size:12px;line-height:1.5;border-radius:8px;}
.app-notice {color:#794052;font-size:11px;margin:12px 35px;}

dialog.modal-backdrop[open] {display:block;} dialog::backdrop {background:#322c2f77;}

.editor-content {resize:vertical;white-space:pre-wrap;}.sidebar {position:sticky;top:0;height:100dvh;overflow-y:auto;overflow-x:hidden;}

@media(max-width:760px) {.mobile-brand {display:flex;}.breadcrumbs {display:none;}.topbar {padding:0 16px;}.toolbar-tools {width:100%;min-width:0;}.view-tabs {flex-wrap:wrap;}.editor-footer {gap:14px;}}

/* A quiet paper palette, with motion reserved for deliberate interactions. */
:root {
  --ink:#43343c;
  --ink-soft:#79666f;
  --ink-faint:#927d88;
  --paper:#fcf9fa;
  --paper-deep:#f4edf0;
  --white:#fffdfd;
  --citrus:#ddaabc;
  --coral:#965b74;
  --lavender:#f0dee7;
  --line:#68445612;
  --line-strong:#68445626;
  --shadow:0 8px 30px #70445a07;
}
html {scrollbar-width:thin;scrollbar-color:#dcb5c5 var(--paper);}
body {font-family:"Segoe UI",system-ui,sans-serif;}
button,input,textarea,select {-webkit-tap-highlight-color:transparent;}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible {outline:2px solid #ba819a;outline-offset:4px;}
button:disabled {cursor:not-allowed;}
.sidebar {background:#fcf8fa;border-right-color:#eddfe6;padding-top:26px;}
.sidebar-brand,.brand-button {color:#55404b;}
.brand-name {font-size:22px;font-weight:500;}
.brand-mark {box-shadow:2px 3px 0 #ad728b12;}
.brand-mark-sheet {background:#694a5a;}
.sidebar-label {font-size:10px;font-weight:600;color:#846274;}
.nav-item {border-radius:11px;color:#796570;}
.nav-item.selected {background:#f1dfe7;color:#86516a;box-shadow:inset 0 0 0 1px #e7cbd72b;}
.nav-item:hover {background:#f6eaf0;color:#86516a;}
.nav-count {font-variant-numeric:tabular-nums;opacity:.8;}
.flow-navigation .nav-item {min-height:38px;line-height:1.5;}
.flows-heading {gap:6px;}
.flow-add-button {color:#945a73;border:1px solid #ead8e1;padding:5px 6px;font-size:10px;}
.flow-add-button:hover {background:#f1dfe7;}
.sidebar-bottom {border-color:#eddee6;}
.backup-actions .outline-button {background:#fffbfd;border-color:#eadce3;font-weight:500;}
.sync-status {font-size:10px;color:#8b7580;}
.status-dot {background:#c590a8;box-shadow:0 0 0 3px #f0dee7;}
.avatar {background:#f0dfe7;color:#8a546d;}
.account-chip {border-radius:12px;}
.topbar {height:68px;border-bottom-color:#efe4e9;background:#fffdfd66;}
.breadcrumbs {font-size:12px;gap:12px;color:#7b6572;}
.topbar-icon {font-size:11px;color:#846274;}
.topbar-icon:hover {background:#f4e7ed;}
.content-wrap {padding-top:40px;}
.page-intro {margin-bottom:28px;}
.page-intro h1 {font-size:clamp(34px,3.6vw,48px);font-weight:500;line-height:1.14;letter-spacing:-.025em;}
.page-intro p {font-size:14px;line-height:1.7;margin-top:10px;color:#846274;}
.eyebrow {font-size:9px;font-weight:500;color:#846274;}
.eyebrow-line {background:#c58ca6;width:20px;}
.wave {font-size:.48em;color:#bd88a0;transform:rotate(8deg);margin-top:6px;}
.new-note-button,.primary-button {background:#e4bacb;color:#694654;font-size:12px;font-weight:600;border:1px solid #d9a7bc;box-shadow:0 3px 0 #d1a0b51c;}
.new-note-button {border-radius:13px;}
.new-note-button:hover,.primary-button:hover {background:#ddb0c3;color:#62404e;box-shadow:0 3px 0 #d1a0b51c;transform:translateY(-1px);}
.outline-button {background:#fffbfd;border-color:#e7d9e1;font-size:12px;font-weight:500;}
.outline-button:hover {background:#f7edf2;transform:translateY(-1px);}
.ghost-button {font-size:12px;font-weight:500;}
.ghost-button:hover,.icon-button:hover {background:#f4e7ed;color:#8d5971;}
.capture-card {padding:22px 24px 18px;border-radius:23px;border:1px solid #ecdee5;background:#fffdfd;box-shadow:0 8px 25px #87596f05;}
.capture-card::after {background:#f0dbe5;opacity:.55;width:132px;height:132px;right:-30px;top:-92px;}
.capture-card::before {content:"✧";position:absolute;right:38px;top:20px;font:38px Georgia,serif;color:#d5aec0;pointer-events:none;}
.capture-heading strong {font-size:13px;font-weight:600;color:#715363;}
.capture-heading span:not(.capture-key) {font-size:11px;color:#846274;}

.counter-view {max-width:1050px;}
